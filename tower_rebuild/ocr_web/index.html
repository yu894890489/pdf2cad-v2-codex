<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR 文字与笔画</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>OCR 文字与笔画</h1><a href="../../../">返回工作台</a><a href="analysis.pdf" target="_blank">带文字层的分析副本</a><a href="report.json" target="_blank">识别证据 JSON</a></header>
