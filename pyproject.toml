[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-rebuild"
version = "0.1.0"
description = "Local, evidence-based PDF tower member reconstruction"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "PyMuPDF>=1.24,<2", "numpy>=1.26,<3", "scipy>=1.15,<2", "ezdxf>=1.3,<2", "Pillow>=10,<13", "shapely>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ocr = ["rapidocr-onnxruntime==1.4.4", "onnxruntime>=1.18,<2"]

[project.scripts]
tower-rebuild = "tower_rebuild.cli:main"

[tool.setuptools.packages.find]
include = ["tower_rebuild*"]

[tool.setuptools.package-data]
tower_rebuild = ["web/*", "decomposition_web/*", "topology_web/*", "topology_web/vendor/*", "audit_web/*", "model_audit_web/*", "final_web/*", "studio_web/*", "ocr_web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
