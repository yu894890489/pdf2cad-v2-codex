<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图纸分解 · 本地核对</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>图纸分解 / 本地工作台</small><h1 id="title">读取图纸…</h1></div><span id="status">正在读取本地数据</span></header>
<div id="error" hidden role="alert"></div>
<nav><button data-tab="structure" class="active">结构图 · 图元分类</button><button data-tab="tables">表格 · 数据数组</button><a href="summary.json" download>提取报告</a></nav>
<main><aside><h2>图纸内容</h2><p id="counts"></p><label>页面<select id="page"></select></label>
<div id="structure-controls"><h2>图元类型</h2><div id="types"></div><label>用途分类<select id="role"><option value="all">全部用途</option></select></label><label>件号 / 文字 / 图元 ID<input id="search" placeholder="例如 401、前403"></label><p id="visible-count"></p><label class="check"><input id="background" type="checkbox" checked>显示原图底图</label><label class="check"><input id="geometry" type="checkbox" checked>显示分类图元</label><button id="reset">适应窗口</button><p class="hint">滚轮缩放 · 拖动平移 · 点击图元查看原始坐标和分类依据</p><h2>保存的数据</h2><div class="downloads"><a href="structure/primitives.json" download>结构图元数组</a><a href="structure/classification.json" download>分类索引</a><a href="structure/callouts.json" download>圈号与 BOM 对应</a></div></div>
<div id="table-controls" hidden><h2>表格</h2><select id="table-select"><option value="bom">整理后的 BOM 数组</option></select><p class="hint">原始表格保留合并单元格，null 表示合并延续。结构化 BOM 保留原规格、数量、下料长度和证据位置。</p><div class="downloads"><a href="tables/bom.json" download>BOM 数组</a><a href="tables/tables.json" download>全部原始表格数组</a></div></div></aside>
<section id="structure-panel"><div class="caption"><strong>结构图</strong><span>原始 PDF 坐标 · 图元尚未组合成杆件</span></div><div class="canvas-wrap"><canvas id="drawing" aria-label="结构图元分类画布"></canvas></div><div class="selection"><strong id="selected-title">点击图元查看详情</strong><pre id="selected">未选择图元</pre></div><details><summary>提取检查与待确认事项</summary><div id="notes"></div></details></section>
<section id="tables-panel" hidden><div class="caption"><strong id="table-title">BOM 数组</strong><span id="table-count"></span></div><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><details><summary>当前表格原图</summary><img id="table-image" alt="表格原图" hidden></details></section>
</main><script src="app.js" defer></script></body></html>
